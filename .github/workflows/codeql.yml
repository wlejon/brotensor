name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          path: brotensor

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure
        run: |
          cmake -S brotensor -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBROTENSOR_TESTS=OFF

      # Pre-build brass & bronze dependencies outside CodeQL tracing so
      # analysis focuses cleanly and quickly on brotensor itself.
      - name: Pre-build dependencies (outside traced build)
        run: |
          cmake --build build --parallel 4 --target \
            brass bronze_runtime_shared bronze brotensor-native-manifest

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          config-file: brotensor/.github/codeql/codeql-config.yml

      - name: Build brotensor (traced)
        run: |
          cmake --build build --parallel 4 --target \
            brotensor_core brotensor_cpu brotensor_api

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
