version: 2

# The only thing here with a version to bump is the CI itself. brotensor has no
# third-party library dependencies — the CPU backend is scalar C++, the GPU
# backends use the vendor SDKs that ship with their toolchains, and consumers
# vendor this repo via add_subdirectory. So there is no package manifest for
# Dependabot to read, and the "dependencies" it can usefully watch are the
# pinned actions in .github/workflows/.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A handful of actions across two workflows: one PR that moves them all
    # together is easier to review than four that each bump one.
    groups:
      actions:
        patterns: ["*"]
    labels: [ci]
    commit-message:
      prefix: "ci"
    ignore:
      # GitHub maintains the `v4` major tag and ships security fixes to it, so
      # `@v4` is already patched without any PR. Pinning to an exact patch would
      # trade that automatic patching for a codeql-action PR in every repo on
      # each release. Major bumps (v4 -> v5) still come through.
      - dependency-name: "github/codeql-action"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
